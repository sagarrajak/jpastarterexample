version: '3'

services:
  mysql:
    image: mysql:8.0
    restart: no
    environment:
      MYSQL_ROOT_PASSWORD: 'your_root_password'
      MYSQL_DATABASE: 'your_database'
      MYSQL_USER: 'your_user'
      MYSQL_PASSWORD: 'your_password'
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data: